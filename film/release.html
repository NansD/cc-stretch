<!doctype html>
<meta charset="utf-8">
<title>cc-stretch release film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&family=Courier+Prime:wght@400;700&family=Press+Start+2P&display=block">
<link rel="stylesheet" href="kit.css">
<style>
	/* The keys a scene presses, drawn as keycaps on a cream band at the foot of the frame, as the caption sits at its head. */
	#keys { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center; align-items: center; gap: 20px; opacity: 0;
		padding: 78px 0 50px; background: linear-gradient(rgba(244, 241, 234, 0), var(--cream) 42%); }
	#keys .key { min-width: 104px; height: 104px; padding: 0 28px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
		font: 600 52px/1 var(--sans); color: var(--ink); background: #fbf9f4; border: 2px solid #d9d2c3; border-radius: 20px;
		box-shadow: 0 9px 0 #cfc7b6, 0 22px 44px rgba(30, 20, 10, .28); }
	#keys .key small { margin-left: 14px; font: 500 30px/1 var(--sans); color: var(--muted); }
	#keys .key.down { transform: translateY(7px); box-shadow: 0 2px 0 #cfc7b6, 0 10px 24px rgba(30, 20, 10, .22); }
</style>
<div id="stage">
	<div id="card" class="layer"></div>
	<div id="termlayer" class="layer">
		<div id="caption"></div>
		<div id="term-wrap"><div id="term"><div class="bar"><i></i><i></i><i></i><span>claude</span></div><div id="rows"></div></div></div>
	</div>
	<div id="keys"></div>
	<div id="ring"></div>
	<svg id="pointer" viewBox="0 0 24 24"><path d="M3 2 L3 20 L8 15 L11.5 22 L14.5 20.6 L11 13.8 L18 13.8 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>
	<canvas id="clawd" width="14" height="8"></canvas>
	<div id="fade"></div>
	<div id="grain"></div>
</div>
<script src="kit.js"></script>
<script>
// A release film: cards, and scenes cut from its recorded take, each with its caption, the pointer
// travelling to each click and keycaps for each key pressed. The release's cut.js sets window.CUT,
// whose scenes(take) lists the scenes; compose.mjs injects window.TAKE ({ frames, marks }) and the
// cut before the first frame. Everything on screen is a function of the film's time.
//
// A card scene is { kind: 'card', len, html, cls?, clawd?, clicks?, boings?, thuds? }: its html is a
// string or a function of the seconds into the scene, each click ({ at, x, y }) lands that many
// seconds into it at that pixel, and each boing (a spring let go) or thud (a landing) sounds that many
// seconds into it. A take scene is { kind: 'take', len, from, to, caption, small?, focus, zoom?,
// growth?, click?, keys? }: it plays take seconds `from` to `to` (a growth plays each captured screen
// evenly first), and a click ({ row, col }) or keys (['⌥', '↓']) land as it ends.
let SCENES = null;
function build() {
	// A take recorded at another size than 100 × 30 says so in its marks.
	const size = window.TAKE.marks.size;
	if (size) setTermSize(size.cols, size.rows);
	let at = 0;
	SCENES = window.CUT.scenes(window.TAKE).map((scene) => {
		const placed = { ...scene, a: at, b: at + scene.len };
		at += scene.len;
		return placed;
	});
	window.TOTAL = at;
	window.CUES = {
		cards: SCENES.filter((s) => s.kind === 'card').map(({ a, b }) => [a, b]),
		takes: SCENES.filter((s) => s.kind === 'take').map(({ a, b }) => [a, b]),
		clicks: SCENES.flatMap((s) => (s.click ? [s.b] : (s.clicks ?? []).map((c) => s.a + c.at))).sort((a, b) => a - b),
		keys: SCENES.filter((s) => s.keys).map((s) => ({ at: s.b, count: s.keys.length })),
		boings: SCENES.flatMap((s) => (s.boings ?? []).map((at) => s.a + at)),
		thuds: SCENES.flatMap((s) => (s.thuds ?? []).map((at) => s.a + at)),
	};
}

function cardScene(scene, t) {
	show('card', 1);
	card(typeof scene.html === 'function' ? scene.html(t - scene.a) : scene.html, scene.cls ?? '');
	if (scene.clawd) drawClawd({ pose: Math.floor(t * 2) % 2 ? 'wave' : 'idle', x: W / 2 - 98, y: 150 + Math.round(Math.sin(t * 6) * 2) * 7, px: 14 });
	pointTo((scene.clicks ?? []).map((c) => ({ ...c, at: scene.a + c.at })), t);
	const first = SCENES[0] === scene, last = SCENES.at(-1) === scene;
	show('fade', (first ? 1 - span(t, scene.a, scene.a + 0.5) : 1 - span(t, scene.a, scene.a + 0.35)) + (last ? span(t, scene.b - 0.6, scene.b) : span(t, scene.b - 0.35, scene.b)));
}

function takeScene(scene, t) {
	show('termlayer', 1);
	const k = clamp((t - scene.a) / (scene.b - scene.a));
	drawRows(scene.growth ? evenFrame(scene, t - scene.a) : frameAt(lerp(scene.from, scene.to, k)));
	// The camera follows the rows that matter, moving from the previous take scene's framing; a cut
	// to or from a card passes through cream.
	const i = SCENES.indexOf(scene);
	const joinsBefore = SCENES[i - 1]?.kind === 'take', joinsAfter = SCENES[i + 1]?.kind === 'take';
	const before = joinsBefore ? SCENES[i - 1] : scene;
	const blend = ease(span(t, scene.a, scene.a + 0.6));
	const cam = placeTerm(lerp(before.zoom ?? 1.3, scene.zoom ?? 1.3, blend), lerp(before.focus, scene.focus, blend));
	$('caption').innerHTML = `${scene.caption}<small>${scene.small || '&nbsp;'}</small>`;
	$('caption').style.opacity = 1;
	pointTo(SCENES.filter((s) => s.click).map((s) => ({ at: s.b, ...cellToScreen(cam, s.click.row, s.click.col) })), t);
	show('fade', (joinsBefore ? 0 : 1 - span(t, scene.a, scene.a + 0.35)) + (joinsAfter ? 0 : span(t, scene.b - 0.35, scene.b)));
}

/** Keycaps rise 0.6 s before their scene ends, go down as it ends, and leave 1 s later. */
function keycaps(t) {
	const scene = SCENES.find((s) => s.keys && t > s.b - 0.6 && t < s.b + 1.0);
	if (!scene) { show('keys', 0); return; }
	const html = scene.keys.map((key) => `<div class="key${t >= scene.b && t < scene.b + 0.18 ? ' down' : ''}">${key}</div>`).join('');
	if ($('keys').dataset.html !== html) { $('keys').dataset.html = html; $('keys').innerHTML = html; }
	const rise = ease(span(t, scene.b - 0.6, scene.b - 0.35));
	$('keys').style.opacity = rise * (1 - span(t, scene.b + 0.7, scene.b + 1.0));
	$('keys').style.transform = `translateY(${lerp(30, 0, rise)}px)`;
}

window.setState = async ({ t }) => {
	if (!SCENES) build();
	for (const id of ['card', 'termlayer']) show(id, 0);
	drawClawd(null);
	const scene = SCENES.find((s) => t >= s.a && t < s.b) ?? SCENES.at(-1);
	if (scene.kind === 'card') cardScene(scene, t);
	else takeScene(scene, t);
	keycaps(t);
	await endFrame();
};
</script>
